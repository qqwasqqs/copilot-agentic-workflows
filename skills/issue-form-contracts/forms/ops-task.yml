name: Operational Task (Chore)
description: Non-feature work such as tooling, docs, local development, CI/CD, or housekeeping
title: "[Ops] <action> <subject> (<area>)"
labels: ["ops", "chore"]
body:
  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Pick the closest category.
      options:
        - Tooling / Linting
        - Local Dev Environment
        - Documentation / Guides
        - Agent Instructions / Templates
        - CI/CD / Automation
        - Security / Compliance
        - Housekeeping / Cleanup
        - Process / Project hygiene
        - Other
      default: 0

  - type: input
    id: related
    attributes:
      label: Related Feature / Issue (optional)
      placeholder: "#123 or link"

  - type: textarea
    id: rationale
    attributes:
      label: Rationale
      description: The problem and the expected outcome, not the implementation.
    validations: { required: true }

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Explicit in-scope and out-of-scope boundaries.
      placeholder: |
        In scope:
        - ...
        Out of scope:
        - ...
    validations: { required: true }

  - type: textarea
    id: steps
    attributes:
      label: Steps / Plan
      description: Concrete checklist. Include explicit validation steps.
      placeholder: |
        - [ ] Add <thing>
        - [ ] Update <thing>
        - [ ] Run <verification command> and confirm it succeeds
    validations: { required: true }

  - type: textarea
    id: affected_paths
    attributes:
      label: Affected Paths
      description: Repository-relative paths to change or create. Avoid broad globs.
      placeholder: |
        - <config file>
        - <workflow or pipeline definition>
        - docs/<page>

  - type: textarea
    id: deliverables
    attributes:
      label: Deliverables
      description: Concrete files or outcomes produced.
      placeholder: |
        - <new or updated configuration>
        - <new automation job>
        - <documentation section>

  - type: textarea
    id: risks
    attributes:
      label: Risks / Impact
      placeholder: |
        - Risk: <description>
          Mitigation: <approach>

  - type: textarea
    id: rollback
    attributes:
      label: Backout / Rollback (if needed)
      placeholder: |
        - Revert the configuration change
        - Remove or disable the new automation
        - Restore the previous known-good state

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: 3-7 objectively testable checkboxes mapped to the deliverables.
      placeholder: |
        - [ ] <verification command> succeeds
        - [ ] <automation> runs and passes
        - [ ] <documentation section> exists and is accurate
    validations: { required: true }

  - type: textarea
    id: links
    attributes:
      label: References / Links
      placeholder: |
        - Upstream documentation: <link>
        - Related issues/PRs: #...

  - type: dropdown
    id: effort
    attributes:
      label: Estimated Effort
      options:
        - XS (<= 1h)
        - S (<= 1 day)
        - M (1-3 days)
        - L (> 3 days)
      default: 1
