name: Agent Task (Atomic)
description: A bounded, single-pull-request task suitable for an AI coding agent
title: "[Atomic] <action> <object> (<area>)"
labels: ["agent", "atomic"]
body:
  - type: markdown
    attributes:
      value: |
        ### Authoring help

        This task must be atomic and safely executable by an agent. Use the
        linked Feature Brief and the project's own guardrails as your sources.

        Checklist before submitting:
        - Main Issue Link points to a single Feature Brief.
        - Context / Links cites exact sections of that brief plus project guardrails.
        - Affected Paths are split into Modify and Reference Only; Modify lists
          4-8 specific files or narrow globs.
        - Files / Symbols to Touch lists every file with an Add/Edit/Delete action.
        - Allowed vs Forbidden Changes constrains the blast radius.
        - Contracts to Honor copies the relevant invariants from the brief.
        - Objective is 3-6 testable checkboxes.
        - Observability, security, tests, and PR boundaries are all filled in.
        - Anything outside Modify paths must be asked about before acting.

        Missing information belongs in the Feature Brief's Open Questions, not here.

  - type: input
    id: main_issue
    attributes:
      label: Main Issue Link
      description: The Feature Brief issue number or URL.
      placeholder: "#1234"
    validations: { required: true }

  - type: textarea
    id: context
    attributes:
      label: Context / Links
      description: Exact sections of the Feature Brief plus the project guardrails that apply.
      placeholder: |
        - Main spec sections: #1234 - API/UX Contracts, Non-Functional Requirements
        - Project guardrails: <paths supplied by the project>
    validations: { required: true }

  - type: textarea
    id: affected_paths
    attributes:
      label: Affected Paths (Scope Gate)
      description: Paths that may be modified versus read for context only. Ask before going outside Modify.
      placeholder: |
        Modify:
        - <module>/<area>/**
        - <service>/<file>
        - tests/<area>/**
        Reference Only:
        - <interface or schema definition>
        - <project guardrail document>
    validations: { required: true }

  - type: textarea
    id: files_symbols
    attributes:
      label: Files / Symbols to Touch (Authoritative)
      description: Every file with an action, plus the symbols to add or change. Ask before exceeding this list.
      placeholder: |
        Files:
        - Edit: <path> - <what changes>
        - Add: <path> - <what it contains>
        - Add: <test path> - <cases covered>
        Symbols:
        - <Symbol> (new)
        - <Symbol> (changed)
    validations: { required: true }

  - type: textarea
    id: allowed_forbidden
    attributes:
      label: Allowed vs Forbidden Changes
      description: Limit the blast radius explicitly.
      placeholder: |
        Allowed:
        - Add files under the declared Modify paths
        - Extend existing functions without broad refactors
        - Add tests under the declared test paths
        Forbidden:
        - Add new dependencies
        - Change infrastructure or deployment configuration
        - Touch unrelated components or global configuration
        - Remove existing public interfaces
    validations: { required: true }

  - type: textarea
    id: contracts_alignment
    attributes:
      label: Contracts to Honor
      description: Type names, error semantics, pagination, authorization expectations taken from the Feature Brief.
      placeholder: |
        - Types: <names>
        - Errors: <condition -> response>
        - Pagination: <rule and limits>
        - Authorization: <requirement>
    validations: { required: true }

  - type: textarea
    id: objective
    attributes:
      label: Objective (Definition of Done)
      description: 3-6 testable, observable checkboxes.
      placeholder: |
        - [ ] <behavior> implemented
        - [ ] <supporting change> added
        - [ ] Unit and integration tests pass
        - [ ] No forbidden changes were made
        - [ ] Observability hooks added
    validations: { required: true }

  - type: textarea
    id: technical
    attributes:
      label: Technical Details
      description: Hard constraints and intentional side effects.
      placeholder: |
        Constraints:
        - <language or style constraints>
        - <performance budget>
        - <data access constraints>
        Side effects:
        - <intentional side effect>
    validations: { required: true }

  - type: textarea
    id: observability
    attributes:
      label: Observability Hooks
      description: Logging, metrics, and tracing to add or update. No sensitive data.
      placeholder: |
        - Logs: structured, correlated by request identifier
        - Metrics: <metric names>
        - Tracing: <span attributes>
        - No secrets or personal data in logs
    validations: { required: true }

  - type: textarea
    id: dependencies
    attributes:
      label: Depends On / Blocks
      description: Sub-issues that must precede this one or that it unblocks.
      placeholder: |
        Depends on: #<id>
        Blocks: #<id>

  - type: textarea
    id: test_data
    attributes:
      label: Test Data & Verification Steps
      description: Fixtures, exact commands, and expected results.
      placeholder: |
        Fixtures:
        - <fixture description>
        Verification commands:
        - <command>
        Expected:
        - <observable result>
    validations: { required: true }

  - type: dropdown
    id: diff_size
    attributes:
      label: Expected Diff Size
      description: Keep atomic; prefer Small.
      options:
        - Small (<= 80 lines)
        - Medium (81-200 lines)
        - Large (> 200 lines; requires prior plan approval)
      default: 0

  - type: textarea
    id: pr_boundaries
    attributes:
      label: PR Boundaries
      description: What the pull request will and will not contain.
      placeholder: |
        Include:
        - <the change, its tests, its instrumentation>
        Exclude:
        - Unrelated refactors, infrastructure changes, dependency upgrades

  - type: textarea
    id: security_privacy
    attributes:
      label: Security / Privacy Checks
      description: Acknowledge the critical guardrails for this change.
      placeholder: |
        - No secrets or personal data in logs
        - Input validation present
        - Authorization enforced
        - Error messages do not leak internals
        - Writes are idempotent where required

  - type: dropdown
    id: rollout_nature
    attributes:
      label: Roll-forward Nature
      description: Clarifies whether rollback planning is required.
      options:
        - Additive (roll-forward only)
        - Migration (needs rollback plan)
        - Risky (extra review required)
      default: 0

  - type: textarea
    id: tests
    attributes:
      label: Tests & Validation
      description: What must be covered and how success is verified.
      placeholder: |
        - Unit: <scope>
        - Integration: <scope>
        - Performance: <if applicable>
        - All suites green
    validations: { required: true }

  - type: textarea
    id: agent_instructions
    attributes:
      label: Agent Instructions
      value: |
        - Stay inside the declared Modify paths; never change Reference Only files.
        - Do not go beyond the Files / Symbols list without asking first.
        - Propose a short plan before applying a non-trivial or public-interface change.
        - Iterate until the declared verification commands pass.
        - Link this task and the Feature Brief in the pull request description, and
          follow the repository's pull request template if one exists.
