name: Operational Task (Chore)
description: Non-feature work such as tooling, docs, local dev, CI/CD, or housekeeping
title: "[Ops] <action> <subject> (<area>)"
labels: ["ops", "chore"]
# projects: ["your-org/123"]   # optional
body:
  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Pick the closest category.
      options:
        - Tooling / Linting (ESLint, Prettier)
        - Local Dev Environment
        - Documentation / Guides
        - Copilot Instructions / Templates
        - CI/CD / Automation
        - Security / Compliance
        - Housekeeping / Cleanup
        - Process / Project hygiene
        - Other
      default: 0

  - type: input
    id: related
    attributes:
      label: Related Feature / Issue (optional)
      placeholder: "#123 or link"

  - type: textarea
    id: rationale
    attributes:
      label: Rationale
      description: Why this task is needed and the expected outcome.
    validations: { required: true }

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Keep it small and concrete; list what is in and out.
      placeholder: |
        In scope:
        - ...
        Out of scope:
        - ...
    validations: { required: true }

  - type: textarea
    id: steps
    attributes:
      label: Steps / Plan
      description: Checklist of concrete steps.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations: { required: true }

  - type: textarea
    id: affected_paths
    attributes:
      label: Affected Paths
      description: Repo-relative paths for changes (helps reviewers and agents scope work).
      placeholder: |
        - .github/**
        - docs/**
        - .eslintrc.*
        - package.json

  - type: textarea
    id: deliverables
    attributes:
      label: Deliverables
      description: Files or outcomes to produce.
      placeholder: |
        - Updated .eslintrc.* and package.json scripts
        - Docs: docs/contributing.md section on linting

  - type: textarea
    id: risks
    attributes:
      label: Risks / Impact
      placeholder: |
        - Risk: ...
          Mitigation: ...

  - type: textarea
    id: rollback
    attributes:
      label: Backout / Rollback (if needed)
      placeholder: |
        - Revert config changes in X
        - Restore prior versions

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      placeholder: |
        - [ ] Docs updated
        - [ ] CI passes
        - [ ] Local dev instructions verified
    validations: { required: true }

  - type: textarea
    id: links
    attributes:
      label: References / Links
      placeholder: |
        - Upstream docs:
        - Examples:
        - Related PRs/Issues: #...

  - type: dropdown
    id: effort
    attributes:
      label: Estimated Effort
      options:
        - XS (≤ 1h)
        - S (≤ 1 day)
        - M (1–3 days)
        - L (> 3 days)
      default: 1
